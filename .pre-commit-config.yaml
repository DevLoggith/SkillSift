repos:
  # general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      # --- Frontend: Biome ---
      - id: biome-check
        name: biome check (frontend)
        entry: npx --prefix frontend biome check
        args: [--write, --no-errors-on-unmatched, --config-path=frontend/biome.json]
        language: system
        files: ^frontend/.*\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\.(ts|cts|mts)|jsonc?|css)$

      # --- Backend: Ruff via uv ---
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run ruff check
        args: [--fix, --exit-non-zero-on-fix]
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
